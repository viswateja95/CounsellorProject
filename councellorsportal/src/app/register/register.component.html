<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Register as Counsellor</h4>
                </div>
                <div class="card-body">
                    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
                            {{ successMessage }}
                        </div>

                        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
                            {{ errorMessage }}
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" formControlName="name"
                                [class.is-invalid]="submitted && f['name'].errors">
                            <div *ngIf="submitted && f['name'].errors" class="invalid-feedback d-block">
                                <span *ngIf="f['name'].errors['required']">Name is required</span>
                                <span *ngIf="f['name'].errors['minlength']">Name must be at least 3 characters</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" formControlName="email"
                                [class.is-invalid]="submitted && f['email'].errors">
                            <div *ngIf="submitted && f['email'].errors" class="invalid-feedback d-block">
                                <span *ngIf="f['email'].errors['required']">Email is required</span>
                                <span *ngIf="f['email'].errors['email']">Email must be valid</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phno" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phno" formControlName="phno"
                                [class.is-invalid]="submitted && f['phno'].errors">
                            <div *ngIf="submitted && f['phno'].errors" class="invalid-feedback d-block">
                                <span *ngIf="f['phno'].errors['required']">Phone is required</span>
                                <span *ngIf="f['phno'].errors['pattern']">Phone must be 10 digits</span>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="pwd" class="form-label">Password</label>
                            <input type="password" class="form-control" id="pwd" formControlName="pwd"
                                [class.is-invalid]="submitted && f['pwd'].errors">
                            <div *ngIf="submitted && f['pwd'].errors" class="invalid-feedback d-block">
                                <span *ngIf="f['pwd'].errors['required']">Password is required</span>
                                <span *ngIf="f['pwd'].errors['minlength']">Password must be at least 6 characters</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                            {{ loading ? 'Registering...' : 'Register' }}
                        </button>
                    </form>

                    <hr>
                    <p class="text-center mb-0">
                        Already registered? <a routerLink="/login">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
