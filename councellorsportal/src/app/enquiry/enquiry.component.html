<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">Add New Enquiry</h4>
                </div>
                <div class="card-body">
                    <form [formGroup]="enquiryForm" (ngSubmit)="onSubmit()">
                        <!-- Success Message -->
                        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
                            {{ successMessage }}
                        </div>

                        <!-- Error Message -->
                        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
                            {{ errorMessage }}
                        </div>

                        <!-- Student Name -->
                        <div class="mb-3">
                            <label for="studentName" class="form-label">Student Name</label>
                            <input type="text" class="form-control" id="studentName" formControlName="studentName"
                                [class.is-invalid]="submitted && f['studentName'].errors">
                            <div *ngIf="submitted && f['studentName'].errors" class="invalid-feedback d-block">
                                Student name is required (min 3 characters)
                            </div>
                        </div>

                        <!-- Student Phone -->
                        <div class="mb-3">
                            <label for="studentPhno" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="studentPhno" formControlName="studentPhno"
                                [class.is-invalid]="submitted && f['studentPhno'].errors">
                            <div *ngIf="submitted && f['studentPhno'].errors" class="invalid-feedback d-block">
                                Phone must be 10 digits
                            </div>
                        </div>

                        <!-- Course Name -->
                        <div class="mb-3">
                            <label for="courseName" class="form-label">Course Name</label>
                            <input type="text" class="form-control" id="courseName" formControlName="courseName"
                                placeholder="e.g., MERN Stack, Java Full Stack"
                                [class.is-invalid]="submitted && f['courseName'].errors">
                            <div *ngIf="submitted && f['courseName'].errors" class="invalid-feedback d-block">
                                Course name is required
                            </div>
                        </div>

                        <!-- Class Mode -->
                        <div class="mb-3">
                            <label for="classMode" class="form-label">Class Mode</label>
                            <select class="form-control" id="classMode" formControlName="classMode"
                                [class.is-invalid]="submitted && f['classMode'].errors">
                                <option value="">Select Mode</option>
                                <option *ngFor="let mode of classModes" [value]="mode">{{ mode }}</option>
                            </select>
                            <div *ngIf="submitted && f['classMode'].errors" class="invalid-feedback d-block">
                                Class mode is required
                            </div>
                        </div>

                        <!-- Status -->
                        <div class="mb-3">
                            <label for="enqStatus" class="form-label">Status</label>
                            <select class="form-control" id="enqStatus" formControlName="enqStatus">
                                <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-info w-100 text-white" [disabled]="loading">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                            {{ loading ? 'Adding...' : 'Add Enquiry' }}
                        </button>

                        <a routerLink="/dashboard" class="btn btn-secondary w-100 mt-2">Back to Dashboard</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
